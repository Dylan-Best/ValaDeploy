<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ValaDeploy Dashboard</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="../styles/dashboard.tailwind.config.js"></script>
<link href="../styles/dashboard.css" rel="stylesheet">
</head>
<body class="bg-background text-on-surface font-body-md text-body-md antialiased overflow-hidden flex h-screen" data-page="projects">
<!-- Shared Component: SideNavBar -->
<div data-component="../components/sidebar.html"></div>
<!-- Main Content Area -->
<main class="flex-1 ml-64 h-full overflow-y-auto bg-background">
<div class="max-w-max-width mx-auto px-margin-desktop py-xl">
<!-- Page Header -->
<header class="flex justify-between items-center mb-xl">
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Projects</h1>
<p class="font-body-sm text-body-sm text-secondary mt-xs">Manage and monitor your deployments.</p>
</div>
<div class="flex items-center gap-lg">
    <span id="user-fullname" class="font-label-sm text-label-sm text-secondary"></span>
    <a href="new-project.html" class="bg-primary-container text-on-primary px-lg py-sm rounded flex items-center gap-sm font-label-md text-label-md transition-opacity hover:opacity-90">
        <span class="material-symbols-outlined text-[18px]">add</span>
        New Project
    </a>
</div>
</header>

<!-- Statistics Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-lg mb-xl">
    <!-- Stat Card 1 -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-lg flex flex-col gap-sm">
        <div class="flex items-center gap-xs text-secondary">
            <span class="material-symbols-outlined text-[18px]">folder</span>
            <span class="font-label-sm text-label-sm uppercase tracking-wider">Total Projects</span>
        </div>
        <div id="total-projects" class="font-display text-display text-on-surface">0</div>
    </div>
    <!-- Stat Card 2 -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-lg flex flex-col gap-sm">
    <div class="flex items-center gap-xs text-secondary">
        <span class="material-symbols-outlined text-[18px]">radar</span>
        <span class="font-label-sm text-label-sm uppercase tracking-wider">Critical Vuln Failures</span>
    </div>
    <div id="critical-vulns" class="font-display text-display text-error">0%</div>
    </div>
    <!-- Stat Card 3 -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-lg flex flex-col gap-sm">
        <div class="flex items-center gap-xs text-secondary">
            <span class="material-symbols-outlined text-[18px]">memory</span>
            <span class="font-label-sm text-label-sm uppercase tracking-wider">Running Containers</span>
        </div>
        <div id="running-containers" class="font-display text-display text-on-surface">0</div>
    </div>
</section>

<!-- Project List Table -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
    <div class="w-full overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-outline-variant bg-surface-container-low">
                    <th class="py-md px-lg font-label-sm text-label-sm text-secondary uppercase tracking-wider font-semibold">Project</th>
                    <th class="py-md px-lg font-label-sm text-label-sm text-secondary uppercase tracking-wider font-semibold">Status</th>
                    <th class="py-md px-lg font-label-sm text-label-sm text-secondary uppercase tracking-wider font-semibold">Commit</th>
                    <th class="py-md px-lg font-label-sm text-label-sm text-secondary uppercase tracking-wider font-semibold">Replicas</th>
                    <th class="py-md px-lg text-right"></th>
                </tr>
            </thead>
            <tbody class="font-body-sm text-body-sm text-on-surface divide-y divide-outline-variant" id="projects-table-body">
                <!-- Les projets seront chargés dynamiquement ici -->
                <!-- Ligne de chargement -->
                <tr id="loading-row">
                    <td colspan="5" class="py-lg text-center text-secondary">
                        <div class="flex items-center justify-center gap-sm">
                            <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
                            Chargement des projets...
                        </div>
                    </td>
                </tr>
                <!-- Ligne "aucun projet" (cachée par défaut) -->
                <tr id="empty-row" style="display: none;">
                    <td colspan="5" class="py-xl text-center text-secondary">
                        <span class="material-symbols-outlined text-4xl block mb-sm">folder_open</span>
                        <p>Aucun projet pour le moment</p>
                        <a href="new-project.html" class="inline-block mt-md px-lg py-sm bg-primary-container text-on-primary rounded-lg hover:opacity-90">
                            Créer votre premier projet
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</div>
</main>

<!-- Scripts -->
<script src="../scripts/api/auth.js"></script>
<script src="../scripts/api/project.js"></script>
<script src="../scripts/components.js"></script>
<script src="../scripts/dashboard.js"></script>
</body></html>
